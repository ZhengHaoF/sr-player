name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # baidu_secrets.dart 被 gitignore（含真实凭证），CI 无此文件会导致编译失败。
      # 无真实凭证时用示例占位文件保证可编译（网盘登录不可用，其余功能正常）。
      - name: Seed netdisk credentials
        run: |
          if [ ! -f lib/services/netdisk/baidu_secrets.dart ]; then
            cp lib/services/netdisk/baidu_secrets_example.dart \
               lib/services/netdisk/baidu_secrets.dart
            echo "::notice::使用示例占位凭证构建，网盘登录不可用"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sr-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
